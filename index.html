<body>
<title>Project Topic Checker</title>
<meta name="description" content="Online Project Topic Availability Checker and Management System - live demo">
<style>
:root {
  --primary: #1d5bd6; --primary-dark: #1647a8; --on-primary: #ffffff;

  --card: #ffffff; --field: #ffffff; --field-border: #d5dce8; --soft: #eef2f8; --soft-hover: #e1e7f1;

  --red: #c62845; --red-bg: #fde4e8; --red-ink: #8c1b31; --red-line: #f5c0ca;
  --amber: #a86b00; --amber-bg: #fff1d6; --amber-ink: #6e4700; --amber-line: #f1d9a3;
  --info-bg: #e3edff; --info-ink: #1d3f86; --info-line: #c4d6fb;
  --violet: #5b34b8; --violet-bg: #ece3ff;

    color-scheme: dark;

    --navy: #0a1428; --navy-2: #0f1d3b; --nav-active: #213f8f;
    --ground-a: #0f1726; --ground-b: #131c2e;
    --text: #e4e9f3; --muted: #9aa6bd; --border: #26324a; --row: #202b41; --row-hover: #1b263b;
    --card: #172136; --field: #111a2b; --field-border: #2c3953; --soft: #22304a; --soft-hover: #2b3a58;
    --green: #4fd192; --green-bg: #133526; --green-ink: #a8ecc9; --green-line: #1f5a3f;
    --red: #ff7d93; --red-bg: #3a1720; --red-ink: #ffc2cd; --red-line: #6a2635;
    --amber: #f3b54a; --amber-bg: #3a2a0c; --amber-ink: #fbdc9c; --amber-line: #6a4c14;
    --info-bg: #182a4d; --info-ink: #b9cffb; --info-line: #2a4476;
    --violet: #b9a0ff; --violet-bg: #2a2150;
    --logout-bg: #4a1a26; --logout-ink: #ffb3c1;
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #4d86f0; --primary-dark: #3a72dc; --on-primary: #ffffff;
  --navy: #0a1428; --navy-2: #0f1d3b; --nav-active: #213f8f;
  --ground-a: #0f1726; --ground-b: #131c2e;
  --text: #e4e9f3; --muted: #9aa6bd; --border: #26324a; --row: #202b41; --row-hover: #1b263b;
  --card: #172136; --field: #111a2b; --field-border: #2c3953; --soft: #22304a; --soft-hover: #2b3a58;
  --green: #4fd192; --green-bg: #133526; --green-ink: #a8ecc9; --green-line: #1f5a3f;
  --red: #ff7d93; --red-bg: #3a1720; --red-ink: #ffc2cd; --red-line: #6a2635;
  --amber: #f3b54a; --amber-bg: #3a2a0c; --amber-ink: #fbdc9c; --amber-line: #6a4c14;
  --info-bg: #182a4d; --info-ink: #b9cffb; --info-line: #2a4476;
  --violet: #b9a0ff; --violet-bg: #2a2150;
  --logout-bg: #4a1a26; --logout-ink: #ffb3c1;
  --shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }
body {
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px;
  color: var(--text); background: linear-gradient(135deg, var(--ground-a) 0%, var(--ground-b) 60%, var(--ground-a) 100%);

}
a { color: var(--primary); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 28px;
  background: var(--card); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; color: var(--text); background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
.brand-logo { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #2166e0, #1446a6); color: #fff; font-weight: 700; font-size: 20px; flex-shrink: 0; }
.brand-title { display: block; font-weight: 700; font-size: 18px; }
.brand-sub { display: block; font-size: 12px; color: var(--muted); }
.user-box { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.user-info { text-align: right; line-height: 1.25; }
.user-info strong { display: block; font-size: 14px; }
.user-info small { color: var(--muted); font-size: 12px; }
.menu-toggle { display: none; border: 0; background: none; font-size: 22px; cursor: pointer; }

.layout { display: flex; min-height: calc(100vh - 70px); }
.sidebar { width: 250px; flex-shrink: 0; background: linear-gradient(180deg, var(--navy), var(--navy-2)); padding: 22px 14px; display: flex; flex-direction: column; }
.menu-label { color: var(--nav-label); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 0 12px 12px; }
.nav-link { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--nav-text); padding: 12px 14px; border-radius: 10px; margin-bottom: 6px; font-size: 15px; background: none; border: 0; cursor: pointer; text-align: left; }
.nav-link:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-link.active { background: var(--nav-active); color: #fff; font-weight: 600; }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .55; }
.nav-link.active .nav-dot { opacity: 1; background: #8fb4ff; }
.side-foot { margin-top: auto; padding: 14px 12px 0; border-top: 1px solid rgba(255,255,255,.08); color: var(--nav-label); font-size: 12px; line-height: 1.5; }
.side-foot button { background: none; border: 0; color: #9fbaf5; cursor: pointer; padding: 0; font-size: 12px; text-decoration: underline; }

.content { flex: 1; padding: 30px 34px; min-width: 0; }
.page-head h1 { margin: 0 0 4px; font-size: 28px; text-wrap: balance; }
.page-head p { margin: 0 0 24px; color: var(--muted); }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 26px; margin-bottom: 22px; border: 1px solid var(--border); }
.card h2 { margin: 0 0 6px; font-size: 20px; }
.card .sub { margin: 0 0 16px; color: var(--muted); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head h2 { margin: 0; }
.narrow { max-width: 860px; margin-left: auto; margin-right: auto; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 18px; margin-bottom: 22px; }
.stat { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; border: 1px solid var(--border); }
.stat-icon { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 14px; }
.stat-icon svg { width: 22px; height: 22px; }
.stat-num { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-label { color: var(--muted); font-size: 14px; }
.i-blue { background: var(--info-bg); color: var(--primary); } .i-green { background: var(--green-bg); color: var(--green); }
.i-red { background: var(--red-bg); color: var(--red); } .i-amber { background: var(--amber-bg); color: var(--amber); } .i-violet { background: var(--violet-bg); color: var(--violet); }

.form-row { display: flex; gap: 12px; flex-wrap: wrap; }
.form-row > .grow { flex: 1; min-width: 200px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.input { width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid var(--field-border); border-radius: 10px; background: var(--field); color: var(--text); }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
.input.is-invalid { border-color: var(--red); }
textarea.input { min-height: 90px; resize: vertical; }
.field-error { color: var(--red); font-size: 13px; margin-top: 5px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.search-wrap .input { padding-left: 38px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; background: var(--primary); color: var(--on-primary); }
.btn:hover { background: var(--primary-dark); }
.btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 8px; }
.btn-green { background: var(--green); color: #fff; } .btn-green:hover { filter: brightness(.92); background: var(--green); }
.btn-red { background: var(--red); color: #fff; } .btn-red:hover { filter: brightness(.92); background: var(--red); }
.btn-light { background: var(--soft); color: var(--text); } .btn-light:hover { background: var(--soft-hover); }
.btn-logout { background: var(--logout-bg); color: var(--logout-ink); padding: 9px 18px; } .btn-logout:hover { background: var(--logout-bg); filter: brightness(.95); }
.btn-block { width: 100%; }
.link-btn { background: none; border: 0; color: var(--primary); cursor: pointer; padding: 0; font-weight: 600; }

.alert { padding: 14px 18px; border-radius: 10px; margin-bottom: 18px; border: 1px solid transparent; }
.alert-success { background: var(--green-bg); color: var(--green-ink); border-color: var(--green-line); }
.alert-error { background: var(--red-bg); color: var(--red-ink); border-color: var(--red-line); }
.alert-info { background: var(--info-bg); color: var(--info-ink); border-color: var(--info-line); }
.result { border-radius: var(--radius); padding: 20px 24px; margin-bottom: 22px; border: 1px solid transparent; }
.result h3 { margin: 0 0 8px; font-size: 17px; }
.result p { margin: 0 0 6px; }
.result ul { margin: 8px 0 0; padding-left: 20px; }
.result-available { background: var(--green-bg); border-color: var(--green-line); color: var(--green-ink); }
.result-similar { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber-ink); }
.result-taken, .result-pending, .result-invalid { background: var(--red-bg); border-color: var(--red-line); color: var(--red-ink); }
.result-exists { background: var(--info-bg); border-color: var(--info-line); color: var(--info-ink); }
.result form { margin-top: 14px; color: var(--text); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); padding: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 14px 12px; border-bottom: 1px solid var(--row); vertical-align: middle; font-size: 14px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--row-hover); }
.t-title { font-weight: 600; }
.t-desc { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.empty { text-align: center; color: var(--muted); padding: 28px; }
.muted { color: var(--muted); }
.badge { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-available, .b-approved { background: var(--green-bg); color: var(--green); }
.b-selected, .b-rejected { background: var(--red-bg); color: var(--red); }
.b-pending { background: var(--amber-bg); color: var(--amber); }
.b-new { background: var(--violet-bg); color: var(--violet); }
.b-existing { background: var(--info-bg); color: var(--info-ink); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .search-wrap { flex: 1; min-width: 200px; }
.toolbar select { width: 190px; max-width: 100%; }
.action-cell { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.remark { padding: 7px 10px; font-size: 13px; min-width: 150px; flex: 1; }

.auth-page { display: grid; place-items: center; min-height: 100vh; padding-block: 24px; padding-inline: 16px; }
.auth-card { width: 100%; max-width: 440px; }
.auth-card.wide { max-width: 640px; }
.auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.auth-foot { text-align: center; margin-top: 16px; color: var(--muted); font-size: 14px; }
.demo-box { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--muted); margin-top: 16px; line-height: 1.7; }
.demo-box code { background: var(--card); padding: 1px 6px; border-radius: 5px; color: var(--text); }
.demo-box .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pw-wrap { position: relative; }
.pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 13px; }

.report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.report-grid .card { margin-bottom: 22px; }
.bar { height: 10px; background: var(--soft); border-radius: 10px; overflow: hidden; margin-top: 6px; }
.bar > span { display: block; height: 100%; background: var(--primary); border-radius: 10px; }
.kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--row); font-variant-numeric: tabular-nums; }
.kv:last-child { border-bottom: 0; }

.modal-back { position: fixed; inset: 0; background: rgba(8, 15, 30, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.modal p { margin: 0 0 18px; }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; }

@media (max-width: 900px) {
  .menu-toggle { display: block; }
  .sidebar { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); bottom: 0; left: -260px; z-index: 30; transition: left .2s; }
  .sidebar.open { left: 0; }
  .content { padding: 22px 16px; }
  .grid-2 { grid-template-columns: 1fr; }
  .brand-sub, .user-info { display: none; }
  .topbar { padding: 0 16px; }
  .page-head h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }

<script>
/* Online Project Topic Availability Checker - browser demo.
   Same rules as the PHP + MySQL version; data is stored in this browser (localStorage). */

const APP_NAME = 'Project Topic Checker';
const TAGLINE = 'Online Project Topic Availability Checker';
const DEPARTMENTS = ['Computer Science', 'Information Technology', 'BCA', 'MCA', 'Electronics', 'Mechanical', 'Civil'];
const MAX_PENDING = 3;
const KEY = 'ptc-demo-v1';
const STOPWORDS = new Set(['a','an','the','of','for','and','in','on','to','with','using','by','based','via','system','systems','online','website','web','site','app','application','management','portal','project','platform','software','tool','digital','smart']);

const ICONS = {
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
};

/* ---------- Storage ---------- */
let db = null;
function persist() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* storage blocked: keep in memory */ } }
function restore() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

async function hash(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ptc:' + text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'plain:' + text; }
}

function stamp(offsetHours) { return new Date(Date.now() - offsetHours * 3600e3).toISOString(); }

async function seed() {
  const users = [
    [1, 'Administrator', 'admin', 'admin@college.edu', '', 'Computer Science', 'admin123', 'admin'],
    [2, 'Student User', 'student', 'student@college.edu', 'CS001', 'Computer Science', 'student123', 'student'],
    [3, 'Rahul Sharma', 'rahul', 'rahul@college.edu', 'CS002', 'Computer Science', 'rahul123', 'student'],
    [4, 'Priya Patel', 'priya', 'priya@college.edu', 'CS003', 'Computer Science', 'priya123', 'student']
  ];
  const topics = [
    ['Online Library Management System', 'A web-based system for managing library books and students', 'Selected', 3],
    ['Online Hospital Management System', 'System for managing hospital records and appointments', 'Available', null],
    ['Student Attendance Management System', 'Application for managing student attendance', 'Available', null],
    ['Online Food Ordering System', 'Website for ordering food online from restaurants', 'Selected', 4],
    ['Hostel Management System', 'Manage hostel rooms, fees and student allotment', 'Available', null],
    ['College Event Management System', 'Plan, publish and register for college events', 'Available', null],
    ['Online Examination System', 'Conduct online tests with automatic result generation', 'Available', null],
    ['Student Result Management System', 'Store marks and publish student results online', 'Available', null]
  ];
  const data = { users: [], topics: [], requests: [], nextId: { user: 5, topic: 9, request: 1 }, session: null };
  for (const u of users) {
    data.users.push({ id: u[0], name: u[1], username: u[2], email: u[3], roll_no: u[4], department: u[5], password: await hash(u[6]), role: u[7], created_at: stamp(48) });
  }
  topics.forEach((t, i) => {
    const at = stamp(topics.length - i);
    data.topics.push({ id: i + 1, title: t[0], description: t[1], department: 'Computer Science', status: t[2], assigned_to: t[3], created_at: at, updated_at: at });
  });
  return data;
}

/* ---------- Helpers ---------- */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => new Date().toISOString();
const niceDate = iso => iso ? new Date(iso).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const shortDate = iso => new Date(iso).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const user = () => db.users.find(u => u.id === db.session) || null;
const userById = id => db.users.find(u => u.id === id) || null;
const studentTopic = id => db.topics.find(t => t.assigned_to === id) || null;
const badge = s => `<span class="badge b-${esc(s.toLowerCase())}">${esc(s)}</span>`;
const typeBadge = t => t === 'new' ? '<span class="badge b-new">New Topic</span>' : '<span class="badge b-existing">Existing</span>';
const byTitle = (a, b) => a.title.localeCompare(b.title);

/* ---------- Topic matching (same algorithm as the PHP version) ---------- */
function normalize(t) { return String(t).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function coreWords(t) {
  const out = new Set();
  for (let w of normalize(t).split(' ')) {
    if (!w || STOPWORDS.has(w)) continue;
    if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) w = w.slice(0, -1);
    out.add(w);
  }
  return [...out];
}
function wordsMatch(a, b) {
  if (a === b) return true;
  const [s, l] = a.length < b.length ? [a, b] : [b, a];
  return s.length >= 4 && l.startsWith(s);
}
function similarity(a, b) {
  const wa = coreWords(a), wb = coreWords(b);
  if (!wa.length || !wb.length) return 0;
  let common = 0;
  for (const x of wa) if (wb.some(y => wordsMatch(x, y))) common++;
  const all = wa.length + wb.length - common;
  return all > 0 ? Math.min(1, common / all) : 0;
}
function validateTitle(t) {
  if (!t) return 'Please enter a project topic.';
  if (t.length < 5) return 'Project topic is too short (minimum 5 characters).';
  if (t.length > 150) return 'Project topic is too long (maximum 150 characters).';
  if (!/^[A-Za-z0-9 .,&()\/'+:-]+$/.test(t)) return "Project topic may contain only letters, numbers, spaces and . , & ( ) / ' + : -";
  if (!/[A-Za-z]{2,}/.test(t)) return 'Project topic must contain meaningful words.';
  if (!coreWords(t).length) return 'Topic is too generic. Add what the system is about, e.g. "PG Finder Website".';
  return null;
}
function validateDescription(t, required = true) {
  if (required && !t) return 'Please enter a short description of the project.';
  if (t && t.length < 10) return 'Description is too short (minimum 10 characters).';
  if (t.length > 1000) return 'Description is too long (maximum 1000 characters).';
  return null;
}
function checkTopic(title, ignoreTopicId = 0, ignoreRequestId = 0) {
  title = clean(title);
  const err = validateTitle(title);
  if (err) return { state: 'invalid', message: err, topic: null, matches: [] };
  let exact = null; const matches = [];
  for (const t of db.topics) {
    if (t.id === ignoreTopicId) continue;
    const score = similarity(title, t.title);
    if (score >= 1 || normalize(title) === normalize(t.title)) exact = t;
    else if (score >= 0.5) matches.push({ ...t, score });
  }
  matches.sort((a, b) => b.score - a.score);
  if (exact) {
    return exact.status === 'Selected'
      ? { state: 'taken', topic: exact, matches, message: 'This topic is already selected by another student and is not available.' }
      : { state: 'exists', topic: exact, matches, message: 'This topic already exists in the list and is available. You can request it.' };
  }
  if (db.requests.some(r => r.status === 'Pending' && r.type === 'new' && r.id !== ignoreRequestId && similarity(title, r.title) >= 1)) {
    return { state: 'pending', topic: null, matches, message: 'Another student has already requested this topic and it is waiting for approval.' };
  }
  if (matches.length) return { state: 'similar', topic: null, matches, message: 'No exact match, but similar topics exist. You can still submit it; the admin will review it.' };
  return { state: 'available', topic: null, matches: [], message: `No existing project topic matches "${title}". You can submit this topic for approval.` };
}
function stats() {
  return {
    total: db.topics.length,
    available: db.topics.filter(t => t.status === 'Available').length,
    selected: db.topics.filter(t => t.status === 'Selected').length,
    pending: db.requests.filter(r => r.status === 'Pending').length,
    students: db.users.filter(u => u.role === 'student').length
  };
}

/* ---------- Actions ---------- */
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); return o; }

async function doLogin(d) {
  const errors = {};
  if (!d.username) errors.username = 'This field is required.';
  if (!d.password) errors.password = 'This field is required.';
  if (Object.keys(errors).length) return fail(errors, { username: d.username });
  const u = db.users.find(x => x.username === d.username);
  if (!u || u.password !== await hash(d.password)) return fail({ login: 'Invalid username or password.' }, { username: d.username });
  db.session = u.id; persist();
  flash('success', `Welcome, ${u.name}!`);
  go(u.role === 'admin' ? 'a-dash' : 's-dash', { query: '' });
}

async function doRegister(d) {
  const e = {};
  if (!/^[A-Za-z .']{3,100}$/.test(d.name)) e.name = 'Enter your full name (letters only, 3-100 characters).';
  if (!/^[A-Za-z0-9\/-]{2,30}$/.test(d.roll_no)) e.roll_no = 'Enter a valid roll number.';
  if (!/^[a-zA-Z0-9_]{3,30}$/.test(d.username)) e.username = 'Username must be 3-30 letters, numbers or underscore.';
  else if (db.users.some(u => u.username.toLowerCase() === d.username.toLowerCase())) e.username = 'This username is already taken.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) e.email = 'Enter a valid email address.';
  else if (db.users.some(u => u.email.toLowerCase() === d.email.toLowerCase())) e.email = 'An account with this email already exists.';
  if (!DEPARTMENTS.includes(d.department)) e.department = 'Please select your department.';
  if (d.password.length < 6) e.password = 'Password must be at least 6 characters.';
  else if (!/[A-Za-z]/.test(d.password) || !/\d/.test(d.password)) e.password = 'Password must contain at least one letter and one number.';
  if (d.password !== d.confirm) e.confirm = 'Passwords do not match.';
  if (Object.keys(e).length) return fail(e, { name: d.name, roll_no: d.roll_no, username: d.username, email: d.email, department: d.department });
  db.users.push({ id: db.nextId.user++, name: d.name, username: d.username, email: d.email, roll_no: d.roll_no.toUpperCase(), department: d.department, password: await hash(d.password), role: 'student', created_at: now() });
  persist();
  flash('success', 'Registration successful. Please login.');
  go('login');
}

function canRequest(u) {
  if (studentTopic(u.id)) { flash('error', 'You already have an approved project topic. You cannot request another one.'); return false; }
  if (db.requests.filter(r => r.student_id === u.id && r.status === 'Pending').length >= MAX_PENDING) {
    flash('error', `You already have ${MAX_PENDING} pending requests. Cancel one or wait for the admin.`); return false;
  }
  return true;
}

function requestExisting(topicId) {
  const u = user();
  const t = db.topics.find(x => x.id === topicId);
  if (!canRequest(u)) return go('s-requests');
  if (!t || t.status !== 'Available') { flash('error', 'Sorry, this topic is no longer available.'); return go('s-checker', { query: ui.query }); }
  if (db.requests.some(r => r.student_id === u.id && r.topic_id === t.id && r.status === 'Pending')) { flash('error', 'You have already requested this topic.'); return go('s-requests'); }
  db.requests.push({ id: db.nextId.request++, student_id: u.id, topic_id: t.id, title: t.title, description: t.description, department: t.department, type: 'existing', status: 'Pending', remark: '', created_at: now(), updated_at: now() });
  persist();
  flash('success', `Request sent for "${t.title}". Wait for admin approval.`);
  go('s-requests', { query: '' });
}

function propose(d) {
  const u = user();
  let title = clean(d.title);
  if (title && title === title.toLowerCase()) title = title.replace(/\b\w/g, c => c.toUpperCase());
  const check = checkTopic(title);
  const e = {};
  if (['invalid', 'taken', 'exists', 'pending'].includes(check.state)) e.title = check.message;
  const descErr = validateDescription(d.description || '');
  if (descErr) e.description = descErr;
  if (!DEPARTMENTS.includes(d.department)) e.department = 'Please select a valid department.';
  if (Object.keys(e).length) {
    if (ui.view === 's-checker' && e.title) { flash('error', e.title); return go('s-checker', { query: ui.query }); }
    return fail(e, d);
  }
  if (!canRequest(u)) return go('s-requests');
  db.requests.push({ id: db.nextId.request++, student_id: u.id, topic_id: null, title, description: d.description, department: d.department, type: 'new', status: 'Pending', remark: '', created_at: now(), updated_at: now() });
  persist();
  flash('success', `Your new topic "${title}" was submitted for approval.`);
  go('s-requests', { query: '' });
}

function saveTopic(d) {
  const editing = ui.editId ? db.topics.find(t => t.id === ui.editId) : null;
  const title = clean(d.title);
  const e = {};
  const check = checkTopic(title, editing ? editing.id : 0);
  if (check.state === 'invalid') e.title = check.message;
  else if (check.state === 'taken' || check.state === 'exists') e.title = `A topic with the same title already exists: "${check.topic.title}".`;
  const de = validateDescription(d.description || '', false); if (de) e.description = de;
  let assigned = null;
  if (d.status === 'Selected') {
    const st = db.users.find(u => u.id === Number(d.assigned_to) && u.role === 'student');
    if (!st) e.assigned_to = 'Select the student this topic is assigned to.';
    else {
      const has = studentTopic(st.id);
      if (has && (!editing || has.id !== editing.id)) e.assigned_to = `${st.name} already has the topic "${has.title}".`;
      assigned = st.id;
    }
  }
  if (Object.keys(e).length) return fail(e, d);
  if (editing) {
    Object.assign(editing, { title, description: d.description, department: d.department, status: d.status, assigned_to: assigned, updated_at: now() });
    flash('success', 'Topic updated successfully.');
  } else {
    db.topics.push({ id: db.nextId.topic++, title, description: d.description, department: d.department, status: d.status, assigned_to: assigned, created_at: now(), updated_at: now() });
    flash('success', 'Topic added successfully.');
  }
  if (assigned) db.requests.forEach(r => { if (r.student_id === assigned && r.status === 'Pending') Object.assign(r, { status: 'Rejected', remark: 'Topic assigned by admin', updated_at: now() }); });
  persist();
  go('a-topics');
}

function approve(id) {
  const r = db.requests.find(x => x.id === id && x.status === 'Pending');
  if (!r) { flash('error', 'Request not found or already processed.'); return render(); }
  const remark = clean(document.getElementById('remark-' + id)?.value || '').slice(0, 255);
  if (studentTopic(r.student_id)) { flash('error', 'This student already has an approved topic.'); return render(); }
  let topic;
  if (r.type === 'existing') {
    topic = db.topics.find(t => t.id === r.topic_id && t.status === 'Available');
    if (!topic) { flash('error', 'This topic is no longer available.'); return render(); }
    Object.assign(topic, { status: 'Selected', assigned_to: r.student_id, updated_at: now() });
  } else {
    const c = checkTopic(r.title, 0, r.id);
    if (['taken', 'exists', 'invalid'].includes(c.state)) { flash('error', 'Cannot approve: ' + c.message); return render(); }
    topic = { id: db.nextId.topic++, title: r.title, description: r.description, department: r.department, status: 'Selected', assigned_to: r.student_id, created_at: now(), updated_at: now() };
    db.topics.push(topic);
  }
  Object.assign(r, { status: 'Approved', topic_id: topic.id, remark: remark || 'Approved', updated_at: now() });
  db.requests.forEach(o => {
    if (o.status !== 'Pending') return;
    if (o.topic_id === topic.id || (o.type === 'new' && similarity(o.title, r.title) >= 1)) Object.assign(o, { status: 'Rejected', remark: 'Topic assigned to another student', updated_at: now() });
    else if (o.student_id === r.student_id) Object.assign(o, { status: 'Rejected', remark: 'Another topic was approved for you', updated_at: now() });
  });
  persist();
  flash('success', `Request approved. "${r.title}" is now assigned to the student.`);
  render();
}

function reject(id) {
  const r = db.requests.find(x => x.id === id && x.status === 'Pending');
  const remark = clean(document.getElementById('remark-' + id)?.value || '').slice(0, 255);
  if (!r) { flash('error', 'Request not found or already processed.'); return render(); }
  if (!remark) { flash('error', 'Please enter a reason when rejecting a request.'); render(); document.getElementById('remark-' + id)?.focus(); return; }
  Object.assign(r, { status: 'Rejected', remark, updated_at: now() });
  persist();
  flash('success', 'Request rejected.');
  render();
}

function csvFor(kind) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  if (kind === 'selected') {
    const rows = db.topics.filter(t => t.status === 'Selected').map((t, i) => { const s = userById(t.assigned_to) || {}; return [i + 1, t.title, t.department, s.name || '', s.roll_no || ''].map(q).join(','); });
    return ['#,Project Topic,Department,Student,Roll No', ...rows].join('\n');
  }
  const rows = db.topics.filter(t => t.status === 'Available').map((t, i) => [i + 1, t.title, t.department, t.description].map(q).join(','));
  return ['#,Project Topic,Department,Description', ...rows].join('\n');
}

function filterTable(id) {
  const table = document.getElementById(id);
  if (!table) return;
  const q = (document.getElementById('f-' + id)?.value || '').trim().toLowerCase();
  const st = document.getElementById('s-' + id)?.value || '';
  let shown = 0;
  table.querySelectorAll('tbody tr[data-row]').forEach(row => {
    const ok = (!q || row.textContent.toLowerCase().includes(q)) && (!st || row.dataset.status === st);
    row.hidden = !ok; if (ok) shown++;
  });
  const empty = table.querySelector('tr[data-empty-filter]');
  if (empty) empty.hidden = shown > 0;
}

/* ---------- Event wiring ---------- */
document.addEventListener('submit', ev => {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const d = formData(form);
  switch (form.dataset.form) {
    case 'login': doLogin(d); break;
    case 'register': doRegister(d); break;
    case 'check': ui.query = clean(d.q); ui.errors = {}; ui.values = {}; render(); break;
    case 'propose': propose(d); break;
    case 'topic': saveTopic(d); break;
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.filter) filterTable(t.dataset.filter);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.statusFilter) filterTable(t.dataset.statusFilter);
  if (t.dataset.actChange === 'status') document.getElementById('assignField').style.visibility = t.value === 'Selected' ? 'visible' : 'hidden';
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('button');
  if (!el) return;
  const ds = el.dataset;
  if (ds.go) return go(ds.go, ds.go === 's-checker' ? { query: '' } : {});
  if (ds.act === 'menu') { ui.menuOpen = !ui.menuOpen; document.querySelector('.sidebar')?.classList.toggle('open', ui.menuOpen); return; }
  if (ds.act === 'logout') { db.session = null; persist(); flash('success', 'You have been logged out.'); return go('login'); }
  if (ds.act === 'pw') { const i = el.parentElement.querySelector('input'); const h = i.type === 'password'; i.type = h ? 'text' : 'password'; el.textContent = h ? 'Hide' : 'Show'; return; }
  if (ds.act === 'reset') return confirmBox('Reset all demo data? Every topic, request and account goes back to the sample data.', async () => { db = await seed(); persist(); flash('success', 'Demo data has been reset.'); go('login'); }, 'Reset data');
  if (ds.fill) { document.getElementById('l-user').value = ds.fill; document.getElementById('l-pass').value = ds.fill + '123'; return; }
  if (ds.request) return requestExisting(Number(ds.request));
  if (ds.cancel) return confirmBox('Cancel this request?', () => {
    const u = user(); db.requests = db.requests.filter(r => !(r.id === Number(ds.cancel) && r.student_id === u.id && r.status === 'Pending'));
    persist(); flash('success', 'Request cancelled.'); render();
  }, 'Cancel request');
  if (ds.edit) { go('a-topics', { editId: Number(ds.edit) }); document.getElementById('topic-form')?.scrollIntoView(); return; }
  if (ds.release) return confirmBox('Release this topic and make it Available again?', () => {
    const t = db.topics.find(x => x.id === Number(ds.release)); Object.assign(t, { status: 'Available', assigned_to: null, updated_at: now() });
    persist(); flash('success', 'Topic released and marked as Available.'); go('a-topics');
  }, 'Release', false);
  if (ds.delete) return confirmBox('Delete this topic permanently?', () => {
    const id = Number(ds.delete); db.topics = db.topics.filter(t => t.id !== id);
    db.requests.forEach(r => { if (r.topic_id === id) r.topic_id = null; });
    persist(); flash('success', 'Topic deleted.'); go('a-topics');
  }, 'Delete');
  if (ds.rfilter) { ui.reqFilter = ds.rfilter; return render(); }
  if (ds.approve) return approve(Number(ds.approve));
  if (ds.reject) return reject(Number(ds.reject));
  if (ds.delstudent) return confirmBox('Delete this student account? Their topic will become Available.', () => {
    const id = Number(ds.delstudent);
    db.topics.forEach(t => { if (t.assigned_to === id) Object.assign(t, { status: 'Available', assigned_to: null, updated_at: now() }); });
    db.requests = db.requests.filter(r => r.student_id !== id);
    db.users = db.users.filter(u => !(u.id === id && u.role === 'student'));
    persist(); flash('success', 'Student removed and their topic (if any) is Available again.'); go('a-students');
  }, 'Delete');
  if (ds.copycsv) {
    const text = csvFor(ds.copycsv);
    const done = () => { flash('success', 'CSV copied. Paste it into Excel or Google Sheets.'); render(); };
    navigator.clipboard?.writeText(text).then(done).catch(() => { flash('info', 'Copy is blocked here. Select the table and copy it instead.'); render(); });
    if (!navigator.clipboard) { flash('info', 'Copy is blocked here. Select the table and copy it instead.'); render(); }
  }
});

/* ---------- Start ---------- */
(async function start() {
  db = restore() || await seed();
  persist();
  const u = user();
  ui.view = u ? (u.role === 'admin' ? 'a-dash' : 's-dash') : 'login';
  render();
})();
</script>

</body>
</html>
